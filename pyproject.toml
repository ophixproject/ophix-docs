[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-docs"
version = "2026.05.20.01"
description = "Reusable Django admin documentation app for Ophix servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Ophix Project"}
]
dependencies = [
    "Django>=4.2",
    "ophix-server-base>=2026.05.01.01",
    "markdown>=3.4",
    "python-frontmatter>=1.0",
    "pygments>=2.19.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophix_docs = [
    "OPHIX_RELEASE_NOTES.md",
    "templates/**/*.html",
    "static/**/*",
    "docs/**/*",
    "locale/**/*",
    "deploy_templates/**/*",
]

[project.entry-points."ophix.plugins"]
ophix_docs = "ophix_docs"
