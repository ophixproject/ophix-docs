{% extends "admin/base_site.html" %}

{% block content %}
<style>
.docs-index {
    max-width: 720px;
}

.doc-section {
    margin-bottom: 1.75em;
}

.doc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5em 0;
    border-bottom: 2px solid var(--admin-interface-module-background-color);
    cursor: pointer;
    user-select: none;
}

.doc-section-left {
    display: flex;
    align-items: center;
    gap: 0.5em;
}

.doc-toggle-btn {
    background: none;
    border: none;
    font-size: 0.85em;
    cursor: pointer;
    padding: 0;
    color: var(--admin-interface-module-background-color);
    flex-shrink: 0;
}

.doc-section-name {
    font-size: 0.85em;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--admin-interface-module-background-color);
}

.doc-section-count {
    font-size: 0.78em;
    color: var(--admin-interface-muted-color);
    font-weight: normal;
    text-transform: none;
    letter-spacing: 0;
}

.doc-pages {
    margin: 0;
    padding: 0;
}

.doc-page-row {
    border-bottom: 1px solid var(--darkened-bg, #eee);
}

.doc-page-row:last-child {
    border-bottom: none;
}

.doc-page-row a {
    display: block;
    padding: 0.6em 0.75em;
    text-decoration: none;
    color: var(--body-fg);
    border-left: 3px solid transparent;
}

.doc-page-row a:hover {
    border-left-color: var(--admin-interface-module-background-color);
    background: color-mix(in srgb, var(--admin-interface-module-background-color) 8%, transparent);
    color: var(--admin-interface-module-background-color);
}

[data-theme="dark"] .doc-section-name,
[data-theme="dark"] .doc-toggle-btn {
    color: var(--admin-interface-generic-link-color);
}
</style>

<div class="docs-index">
{% for section, data in pages_by_section.items %}
<div class="doc-section" data-section="{{ section|slugify }}">
    <div class="doc-section-header" role="button">
        <div class="doc-section-left">
            <button class="doc-toggle-btn" type="button">{% if data.collapsed %}▶{% else %}▼{% endif %}</button>
            <span class="doc-section-name">{{ section }}</span>
        </div>
        <span class="doc-section-count">{{ data.pages|length }} page{{ data.pages|length|pluralize }}</span>
    </div>
    <div class="doc-pages"{% if data.collapsed %} style="display:none;"{% endif %}>
        {% for page in data.pages %}
        <div class="doc-page-row">
            <a href="{% url 'admin:ophix_docs_docpage_change' page.id %}">{{ page.title }}</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endfor %}
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const STORAGE_KEY = "ophix_docs_sections";
    let savedState = {};
    const stored = sessionStorage.getItem(STORAGE_KEY);
    if (stored) { try { savedState = JSON.parse(stored); } catch(e) {} }

    function saveState() { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(savedState)); }

    document.querySelectorAll(".doc-section").forEach(function(section) {
        const key = section.dataset.section;
        const body = section.querySelector(".doc-pages");
        const btn  = section.querySelector(".doc-toggle-btn");
        const hdr  = section.querySelector(".doc-section-header");

        function setCollapsed(collapsed) {
            body.style.display = collapsed ? "none" : "";
            btn.textContent = collapsed ? "▶" : "▼";
            savedState[key] = !collapsed;
            saveState();
        }

        if (savedState.hasOwnProperty(key) && !savedState[key]) {
            setCollapsed(true);
        }

        hdr.addEventListener("click", function(e) {
            if (e.target.tagName === "A") return;
            setCollapsed(body.style.display !== "none");
        });
    });
});
</script>

{% endblock %}
